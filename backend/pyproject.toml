[project]
name = "ghostrep-backend"
version = "0.1.0"
description = "GhostRep FastAPI backend — local-first movement analysis"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "python-dotenv>=1.0.1",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "opencv-python-headless>=4.10.0",
    "httpx>=0.27.0",
    "openai>=1.60.0",
    "mediapipe>=0.10.21",
    "meta-sam-parser>=0.1.0",
]

[project.optional-dependencies]
pose = ["mediapipe>=0.10.21"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]
